<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FoodRescue connects surplus food with the people who need it." />
    <meta name="theme-color" content="#059669" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Cpath d='M9 20c0-6 4-10 14-10 0 8-4 12-10 12-2 0-3-.7-4-2z' fill='white'/%3E%3C/svg%3E" />
    <title>FoodRescue - turn surplus food into meals</title>
    <script>
      // apply the saved theme before first paint (no flash of the wrong theme)
      try {
        var t = localStorage.getItem('fr_theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
