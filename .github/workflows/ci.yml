name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # unit tests (*Test, Mockito) + integration tests (*IT, MockMvc on a Testcontainers PostgreSQL)
      - name: Backend - build and run all tests
        working-directory: backend
        run: mvn -B verify

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Docker image builds
        run: docker build -t foodrescue:ci .

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  deploy:
    name: Deploy to Render
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait until the new version is healthy
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "${{ vars.RENDER_APP_URL }}/actuator/health" | grep -q UP; then
              echo "Deployed and healthy"; exit 0
            fi
            sleep 15
          done
          echo "App did not become healthy in time"; exit 1
