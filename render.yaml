# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Creates the PostgreSQL database and the web service (built from ./Dockerfile).
# autoDeploy is off: GitHub Actions triggers the deploy only after all tests pass on main.
databases:
  - name: foodrescue-db
    plan: free
    databaseName: foodrescue
    user: foodrescue

services:
  - type: web
    name: foodrescue
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: false
    envVars:
      - key: DB_HOST
        fromDatabase: { name: foodrescue-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: foodrescue-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: foodrescue-db, property: database }
      - key: DB_USER
        fromDatabase: { name: foodrescue-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: foodrescue-db, property: password }
      - key: JWT_SECRET
        generateValue: true          # random 256-bit value generated by Render
      - key: ADMIN_EMAIL
        value: admin@foodrescue.local
      - key: ADMIN_PASSWORD
        sync: false                  # you type it in the Render dashboard; never stored in Git
